[project]
name = "incant-mcp"
version = "1.1.0"
description = "MCP server for Incant — prompt authoring, testing, and release for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "incant-sdk>=1.0,<2",
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/cgkanchi/incant"
Repository = "https://github.com/cgkanchi/incant"
Changelog = "https://github.com/cgkanchi/incant/blob/main/CHANGELOG.md"

[project.scripts]
incant-mcp = "incant_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incant_mcp"]

[tool.uv.sources]
incant-sdk = { workspace = true }
