name: Release

# Tag vX.Y.Z → build and publish the container image to GHCR and the Python packages
# (incant-sdk, incant-mcp) to PyPI. CI (ci.yml) gates main; this workflow only packages
# what already passed. `workflow_dispatch` re-runs just the PyPI publish (e.g. after
# configuring PyPI trusted publishing for an already-tagged version).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish incant-sdk + incant-mcp to PyPI"
        type: boolean
        default: true

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pypi:
    if: github.event_name == 'push' || inputs.publish_pypi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: incant-sdk
            environment: pypi-incant-sdk
          - package: incant-mcp
            environment: pypi-incant-mcp
    # PyPI Trusted Publishing (OIDC). One GitHub environment PER package: PyPI requires a
    # *pending* publisher's (owner, repo, workflow, environment) tuple to be unique, so two
    # not-yet-existing projects cannot share one. Register on pypi.org → Publishing →
    # "Add a new pending publisher": project <package>, owner cgkanchi, repo incant,
    # workflow release.yml, environment <environment>. A PYPI_API_TOKEN repository
    # secret, if present, is used instead of OIDC.
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version must match the tag
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          path = {"incant-sdk": "sdk/python/pyproject.toml", "incant-mcp": "mcp/python/pyproject.toml"}["${{ matrix.package }}"]
          v = tomllib.load(open(path, "rb"))["project"]["version"]
          sys.exit(f"{path}: version {v} != tag {tag}" if v != tag else 0)
          PY
      - name: Build
        run: |
          uv build --package ${{ matrix.package }} -o dist
          ls -la dist
      - name: Publish (token)
        if: env.HAS_TOKEN == 'true'
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish (trusted publishing)
        if: env.HAS_TOKEN != 'true'
        run: uv publish --trusted-publishing always dist/*
