[project]
name = "incant-sdk"
version = "1.0.0"
description = "Python SDK for Incant — render, discover, and reproduce prompts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incant_sdk"]
